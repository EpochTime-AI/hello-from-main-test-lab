name: Hello from Main watchdog
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      source_pr_number:
        required: false
        type: string
      source_login:
        required: false
        type: string
permissions:
  contents: write
  pull-requests: write
  checks: read
concurrency:
  group: hello-from-main-publication
  cancel-in-progress: false
jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false
      - name: Run trusted watchdog
        uses: ./
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: main
          HELLO_FROM_MAIN_TRUSTED_SOURCE_REF: refs/heads/main
          HELLO_FROM_MAIN_WORKSPACE: ${{ github.workspace }}
          HELLO_FROM_MAIN_REMOTE: origin
          HELLO_FROM_MAIN_SOURCE_PR_NUMBER: ${{ inputs.source_pr_number }}
          HELLO_FROM_MAIN_SOURCE_LOGIN: ${{ inputs.source_login }}
          HELLO_FROM_MAIN_COMMENT_OWNER_ID: ${{ vars.HELLO_FROM_MAIN_COMMENT_OWNER_ID || (github.server_url == 'https://github.com' && '41898282') }}
          HELLO_FROM_MAIN_COMMENT_OWNER_TYPE: ${{ vars.HELLO_FROM_MAIN_COMMENT_OWNER_TYPE || (github.server_url == 'https://github.com' && 'Bot') }}
